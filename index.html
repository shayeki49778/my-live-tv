<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#05070a">
    <title>Z-Sports — Live Sports & TV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
        :root{
            --bg:#05070a;
            --surface:#0c1016;
            --surface-2:#11161f;
            --line:rgba(255,255,255,.06);
            --line-2:rgba(255,255,255,.1);
            --text:#e8ecf2;
            --muted:#7d8696;
            --accent:#22c55e;        /* emerald — sports */
            --accent-2:#16a34a;
            --hot:#ef4444;           /* live red */
            --gold:#f5b417;          /* trophy */
        }
        html,body{background:var(--bg);}
        body{
            font-family:'Inter',sans-serif;
            color:var(--text);
            -webkit-text-size-adjust:100%;
            touch-action:manipulation;
            background:
              radial-gradient(1200px 600px at 50% -10%, rgba(34,197,94,.10), transparent 60%),
              radial-gradient(800px 400px at 100% 20%, rgba(245,180,23,.05), transparent 60%),
              var(--bg);
        }
        .font-display{font-family:'Sora',sans-serif;letter-spacing:-.01em;}
        .no-scrollbar::-webkit-scrollbar{display:none;}
        .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}
        .aspect-video-custom{aspect-ratio:16/9;}
        .card{background:linear-gradient(180deg,var(--surface) 0%,#090c11 100%);border:1px solid var(--line);}
        .chip{background:rgba(255,255,255,.04);border:1px solid var(--line);}
        .accent-bar{background:linear-gradient(180deg,var(--accent),var(--accent-2));}
        .live-dot{box-shadow:0 0 0 4px rgba(239,68,68,.18);}
        .player-shell{box-shadow:0 24px 60px -20px rgba(0,0,0,.9),0 0 0 1px rgba(34,197,94,.18);}
        .tab-active{background:linear-gradient(180deg,#ffffff,#e5e7eb);color:#05070a !important;}
        .scroll-snap-x{scroll-snap-type:x mandatory;}
        .snap-start{scroll-snap-align:start;}
        .ticker{animation:tick 30s linear infinite;}
        @keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
        .pulse-ring{animation:pr 1.6s ease-out infinite;}
        @keyframes pr{0%{box-shadow:0 0 0 0 rgba(239,68,68,.55)}80%,100%{box-shadow:0 0 0 12px rgba(239,68,68,0)}}
        .btn-press{transition:transform .15s ease;}
        .btn-press:active{transform:scale(.96);}
        .glow-emerald{box-shadow:0 8px 24px -8px rgba(34,197,94,.55);}
        .glow-red{box-shadow:0 8px 24px -8px rgba(239,68,68,.55);}
        .grid-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
        .ad-slot{margin:14px 16px;display:flex;flex-direction:column;align-items:center;}
        .ad-slot .ad-label{font-size:9px;letter-spacing:.16em;font-weight:700;color:#525c6b;text-transform:uppercase;margin-bottom:6px;}
        .ad-slot .ad-frame{width:100%;max-width:728px;height:90px;border:1px solid var(--line);border-radius:12px;background:#0a0e14;overflow:auto;-webkit-overflow-scrolling:touch;}
        .ad-slot iframe{display:block;border:0;}
    </style>
</head>
<body class="antialiased pb-28 selection:bg-emerald-500/30 selection:text-white select-none">

<div class="max-w-md mx-auto min-h-screen relative">

    <header class="sticky top-0 z-50 px-4 pt-3 pb-2 backdrop-blur-xl bg-[#05070a]/85 border-b border-white/[0.04]">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center glow-emerald">
                    <svg viewBox="0 0 24 24" class="w-4 h-4 text-black" fill="currentColor"><path d="M12 2 2 7l10 5 10-5-10-5zm0 7L2 14l10 5 10-5-10-5z"/></svg>
                </div>
                <div class="leading-tight">
                    <h1 class="font-display font-extrabold text-[15px] tracking-tight">Z<span class="text-emerald-400">-Sports</span></h1>
                    <p class="text-[9px] text-gray-500 uppercase tracking-[0.18em] font-semibold">Live Sports · TV · OTT</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="toggleSearch()" class="w-9 h-9 rounded-xl chip btn-press flex items-center justify-center">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4 text-gray-300"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                </button>
                <button onclick="toggleFifaModal()" class="h-9 px-2.5 rounded-xl bg-gradient-to-r from-amber-400 to-yellow-500 text-black btn-press flex items-center gap-1.5 font-bold text-[10px] uppercase tracking-wider">
                    🏆 FIFA 26
                </button>
            </div>
        </div>

        <div class="mt-2.5 chip rounded-lg overflow-hidden">
            <div class="flex items-center gap-2 px-2 py-1.5">
                <span class="shrink-0 flex items-center gap-1 bg-red-500/15 text-red-400 border border-red-500/30 rounded-md px-1.5 py-0.5 text-[9px] font-black uppercase tracking-wider">
                    <span class="w-1.5 h-1.5 rounded-full bg-red-500 pulse-ring"></span> Live
                </span>
                <div class="flex-1 overflow-hidden">
                    <div id="liveTicker" class="ticker whitespace-nowrap text-[11px] font-medium text-gray-300"></div>
                </div>
            </div>
        </div>
    </header>

    <section id="playerSection" class="sticky top-[92px] z-40 px-3 pt-3 hidden">
        <div class="player-shell rounded-2xl overflow-hidden bg-black">
            <div id="videoWrapper" class="relative aspect-video-custom bg-black w-full cursor-pointer" onclick="triggerPlayerControls()">
                <video id="videoPlayer" class="w-full h-full object-contain bg-black" playsinline autoplay></video>

                <div id="playerCustomControls" class="absolute inset-0 flex flex-col justify-between opacity-0 pointer-events-none transition-opacity duration-300 z-10">
                    <div class="bg-gradient-to-b from-black/80 to-transparent p-3 flex items-center justify-between pointer-events-auto">
                        <div class="flex items-center gap-2 min-w-0">
                            <span class="flex items-center gap-1 bg-red-500/20 border border-red-500/40 text-red-300 px-1.5 py-0.5 rounded text-[9px] font-black uppercase tracking-widest">
                                <span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span> Live
                            </span>
                            <span id="overlayTitle" class="text-[12px] font-semibold text-white truncate max-w-[60vw]">Channel</span>
                        </div>
                        <button onclick="event.stopPropagation();closePlayer()" class="w-8 h-8 rounded-full bg-black/50 border border-white/15 flex items-center justify-center backdrop-blur">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="w-4 h-4 text-white"><path d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                    </div>

                    <div class="flex items-center justify-center pointer-events-auto">
                        <button id="overlayPlayPauseBtn" onclick="event.stopPropagation();togglePlayPause()" class="w-14 h-14 rounded-full bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center btn-press">
                            <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 text-white hidden"><path d="M8 5v14l11-7z"/></svg>
                            <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 text-white"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                        </button>
                    </div>

                    <div class="bg-gradient-to-t from-black/80 to-transparent p-3 flex items-center justify-between pointer-events-auto">
                        <div class="flex gap-1 bg-black/60 rounded-lg p-0.5 border border-white/10">
                            <button id="overlayS1Btn" onclick="event.stopPropagation();switchActiveServer(1)" class="px-2.5 py-1 rounded-md text-[9px] font-black uppercase tracking-wider bg-emerald-500 text-black">S1</button>
                            <button id="overlayS2Btn" onclick="event.stopPropagation();switchActiveServer(2)" class="px-2.5 py-1 rounded-md text-[9px] font-black uppercase tracking-wider text-gray-300">S2</button>
                        </div>
                        <button onclick="event.stopPropagation();toggleRotateFullscreen()" class="bg-black/50 border border-white/15 rounded-lg px-2.5 py-1.5 text-[10px] font-bold text-white flex items-center gap-1.5 backdrop-blur">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-3.5 h-3.5"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></svg>
                            Full
                        </button>
                    </div>
                </div>

                <div id="playerLoader" class="absolute inset-0 flex items-center justify-center bg-black/85 backdrop-blur-sm z-20">
                    <div class="relative w-12 h-12">
                        <div class="absolute inset-0 rounded-full border-[3px] border-emerald-500/20"></div>
                        <div class="absolute inset-0 rounded-full border-[3px] border-t-emerald-400 border-r-transparent border-b-transparent border-l-transparent animate-spin"></div>
                    </div>
                </div>
            </div>

            <div class="bg-[#0a0e14] border-t border-white/[0.05] px-3 py-2.5 flex items-center gap-2.5">
                <div id="playerLogoContainer" class="w-10 h-10 rounded-lg bg-black/40 border border-white/[0.06] flex items-center justify-center overflow-hidden p-1 shrink-0"></div>
                <div class="min-w-0 flex-1">
                    <h3 id="playerTitle" class="text-[12px] font-bold text-white truncate">Channel</h3>
                    <p class="text-[10px] text-emerald-400 font-semibold flex items-center gap-1.5 mt-0.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                        Streaming · <span id="activeServerLabel">Server 1</span>
                    </p>
                </div>
                <div class="flex items-center gap-1.5">
                    <button id="switchS1Btn" onclick="switchActiveServer(1)" class="px-2.5 py-1.5 rounded-lg text-[10px] font-bold tracking-wider uppercase bg-emerald-500 text-black btn-press">S1</button>
                    <button id="switchS2Btn" onclick="switchActiveServer(2)" class="px-2.5 py-1.5 rounded-lg text-[10px] font-bold tracking-wider uppercase chip text-gray-300 btn-press">S2</button>
                </div>
            </div>
        </div>
    </section>

    <nav class="sticky top-[92px] z-30 px-4 pt-3 pb-2 bg-[#05070a]/85 backdrop-blur-xl">
        <div id="catTabs" class="flex gap-2 overflow-x-auto no-scrollbar text-[11px] font-bold uppercase tracking-wider"></div>
    </nav>

    <main class="space-y-7 pt-2" id="mainContent">
        <section class="px-4" data-cat="sports">
            <div class="flex items-center justify-between mb-2.5">
                <h2 class="font-display text-[13px] font-extrabold text-white flex items-center gap-2">
                    <span class="w-1 h-4 accent-bar rounded-full"></span> Live Matches
                </h2>
                <button onclick="toggleFifaModal()" class="text-[10px] text-emerald-400 font-bold uppercase tracking-wider">All →</button>
            </div>
            <div id="matchesRow" class="flex gap-3 overflow-x-auto no-scrollbar scroll-snap-x -mx-4 px-4"></div>
        </section>

        <div class="ad-slot" data-ad-slot data-cat="sports"></div>

        <section data-cat="sports">
            <div class="flex items-center justify-between px-4 mb-2.5">
                <h2 class="font-display text-[13px] font-extrabold text-white flex items-center gap-2">
                    <span class="w-1 h-4 accent-bar rounded-full"></span> Sports Channels
                    <span class="text-[10px] text-gray-500 font-medium normal-case tracking-normal" id="sportsCount"></span>
                </h2>
            </div>
            <div id="sportsRow" class="grid-cards px-4"></div>
        </section>

        <section data-cat="bangla">
            <div class="flex items-center justify-between px-4 mb-2.5">
                <h2 class="font-display text-[13px] font-extrabold text-white flex items-center gap-2">
                    <span class="w-1 h-4 rounded-full bg-sky-400"></span> Bangla Entertainment
                    <span class="text-[10px] text-gray-500 font-medium normal-case tracking-normal" id="banglaCount"></span>
                </h2>
            </div>
            <div id="banglaRow" class="grid-cards px-4"></div>
        </section>

        <section data-cat="news">
            <div class="flex items-center justify-between px-4 mb-2.5">
                <h2 class="font-display text-[13px] font-extrabold text-white flex items-center gap-2">
                    <span class="w-1 h-4 rounded-full bg-amber-400"></span> News Networks
                    <span class="text-[10px] text-gray-500 font-medium normal-case tracking-normal" id="newsCount"></span>
                </h2>
            </div>
            <div id="newsRow" class="grid-cards px-4"></div>
        </section>

        <div class="ad-slot" data-ad-slot data-cat="news"></div>

        <section data-cat="hindi">
            <div class="flex items-center justify-between px-4 mb-2.5">
                <h2 class="font-display text-[13px] font-extrabold text-white flex items-center gap-2">
                    <span class="w-1 h-4 rounded-full bg-fuchsia-400"></span> Hindi · Movies & Music
                    <span class="text-[10px] text-gray-500 font-medium normal-case tracking-normal" id="hindiCount"></span>
                </h2>
            </div>
            <div id="hindiRow" class="grid-cards px-4"></div>
        </section>

        <section data-cat="kids">
            <div class="flex items-center justify-between px-4 mb-2.5">
                <h2 class="font-display text-[13px] font-extrabold text-white flex items-center gap-2">
                    <span class="w-1 h-4 rounded-full bg-emerald-300"></span> Kids Zone
                    <span class="text-[10px] text-gray-500 font-medium normal-case tracking-normal" id="kidsCount"></span>
                </h2>
            </div>
            <div id="kidsRow" class="grid-cards px-4"></div>
        </section>

        <div class="ad-slot" data-ad-slot data-cat="kids"></div>

    </main>

    <nav class="fixed bottom-3 left-1/2 -translate-x-1/2 w-[92%] max-w-md z-40">
        <div class="bg-[#0a0e14]/95 backdrop-blur-xl border border-white/[0.06] rounded-2xl px-2 py-2 flex items-center justify-around shadow-[0_10px_40px_rgba(0,0,0,.6)]">
            <button onclick="scrollToTop()" class="flex flex-col items-center gap-0.5 px-4 py-1 rounded-xl text-emerald-400">
                <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path d="M12 3l9 8h-3v9h-4v-6h-4v6H6v-9H3z"/></svg>
                <span class="text-[9px] font-bold uppercase tracking-wider">Home</span>
            </button>
            <button onclick="toggleFifaModal()" class="flex flex-col items-center gap-0.5 px-4 py-1 rounded-xl text-gray-400">
                <span class="text-base leading-none">🏆</span>
                <span class="text-[9px] font-bold uppercase tracking-wider">FIFA</span>
            </button>
            <button onclick="toggleTrendingModal()" class="flex flex-col items-center gap-0.5 px-4 py-1 rounded-xl text-gray-400">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.36 5.21A8.25 8.25 0 1 1 6.04 7.05a8.29 8.29 0 0 0 2.96 2.55 8.98 8.98 0 0 1 3.36-6.87 8.21 8.21 0 0 0 3 2.48z"/></svg>
                <span class="text-[9px] font-bold uppercase tracking-wider">Trending</span>
            </button>
            <button onclick="toggleSearch()" class="flex flex-col items-center gap-0.5 px-4 py-1 rounded-xl text-gray-400">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                <span class="text-[9px] font-bold uppercase tracking-wider">Search</span>
            </button>
        </div>
    </nav>
</div>

<div id="searchOverlay" class="fixed inset-0 bg-black/85 backdrop-blur-lg z-[110] hidden flex-col p-4">
    <div class="max-w-md mx-auto w-full">
        <div class="flex items-center gap-2 mt-2">
            <div class="flex-1 chip rounded-xl flex items-center gap-2 px-3 py-2.5">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4 text-gray-400"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                <input id="searchInput" oninput="renderSearch()" placeholder="Search channels, matches…" class="bg-transparent flex-1 outline-none text-sm placeholder-gray-500">
            </div>
            <button onclick="toggleSearch()" class="text-xs font-bold text-gray-400 px-3 py-2">Cancel</button>
        </div>
        <div id="searchResults" class="mt-4 space-y-2 max-h-[80vh] overflow-y-auto no-scrollbar"></div>
    </div>
</div>

<div id="fifaModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-[100] hidden items-end sm:items-center justify-center">
    <div class="bg-[#0a0e14] w-full max-w-md rounded-t-3xl sm:rounded-3xl border border-white/[0.06] p-4 max-h-[85vh] overflow-hidden flex flex-col">
        <div class="flex items-center justify-between pb-3 border-b border-white/5 mb-3">
            <div class="flex items-center gap-2">
                <span class="w-8 h-8 rounded-lg bg-amber-400/15 text-amber-400 flex items-center justify-center">🏆</span>
                <div>
                    <h3 class="font-display text-sm font-extrabold">FIFA World Cup 2026</h3>
                    <p class="text-[10px] text-gray-500">Upcoming & live matches</p>
                </div>
            </div>
            <button onclick="toggleFifaModal()" class="w-8 h-8 rounded-lg chip flex items-center justify-center">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4"><path d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <div id="fifaMatchListContainer" class="space-y-2 overflow-y-auto no-scrollbar"></div>
    </div>
</div>

<div id="serverModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-[100] hidden items-center justify-center p-4">
    <div class="bg-[#0a0e14] w-full max-w-xs rounded-2xl border border-white/[0.06] p-5 text-center">
        <div class="w-12 h-12 bg-emerald-500/15 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">⚡</div>
        <h3 id="modalStreamTitle" class="text-sm font-bold text-white truncate px-1">Choose Server</h3>
        <p class="text-[10px] text-gray-500 mt-1 mb-4">Switch if one stream lags</p>
        <div class="space-y-2">
            <button onclick="processServerSelection(1)" class="w-full bg-emerald-500 hover:bg-emerald-400 text-black py-3 rounded-xl text-xs font-bold uppercase tracking-wider btn-press glow-emerald">🚀 Server 1 · HD</button>
            <button onclick="processServerSelection(2)" class="w-full chip text-gray-100 py-3 rounded-xl text-xs font-bold uppercase tracking-wider btn-press">⚡ Server 2 · Backup</button>
        </div>
        <button onclick="closeServerModal()" class="mt-4 text-[10px] font-bold uppercase tracking-widest text-gray-500">Cancel</button>
    </div>
</div>

<div id="trendingModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-[100] hidden items-end sm:items-center justify-center">
    <div class="bg-[#0a0e14] w-full max-w-md rounded-t-3xl sm:rounded-3xl border border-white/[0.06] p-4 max-h-[80vh] overflow-hidden flex flex-col">
        <div class="flex items-center justify-between pb-3 border-b border-white/5 mb-3">
            <h3 class="font-display text-sm font-extrabold flex items-center gap-2">🔥 Trending Now</h3>
            <button onclick="toggleTrendingModal()" class="w-8 h-8 rounded-lg chip flex items-center justify-center">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4"><path d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <div id="trendingList" class="space-y-2 overflow-y-auto no-scrollbar"></div>
    </div>
</div>

function updateFifaTimers() {
    appData.fifa_matches.forEach(match => {
        const a = document.getElementById(`timer-${match.id}`);
        const b = document.getElementById(`card-timer-${match.id}`);
        const diff = new Date(match.dateStr).getTime() - Date.now();
        let shortText, longText;
        if (diff <= 0) {
            shortText = "LIVE"; longText = "● LIVE NOW";
        } else {
            const d = Math.floor(diff/86400000),
                  h = Math.floor(diff%86400000/3600000),
                  m = Math.floor(diff%3600000/60000),
                  s = Math.floor(diff%60000/1000);
            shortText = d>0 ? `${d}d ${h}h` : `${h}h ${m}m`;
            longText  = d>0
                ? `Starts in ${d}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m`
                : `Starts in ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }
        if(a) a.textContent = shortText;
        if(b) b.textContent = longText;
    });
}

function executeCoreStream(url, name, channelObj, serverNum) {
    if(!activeStreamPayload.name || activeStreamPayload.name !== name){
        activeStreamPayload = { name, s1: url, s2: url, channelObj };
    }
    const playerSection = document.getElementById("playerSection");
    const video = document.getElementById("videoPlayer");
    const loader = document.getElementById("playerLoader");
    const logoContainer = document.getElementById("playerLogoContainer");

    document.getElementById("playerTitle").textContent = name;
    document.getElementById("overlayTitle").textContent = name;
    document.getElementById("activeServerLabel").textContent = `Server ${serverNum}`;
    setServerButtons(serverNum);

    if (channelObj && (channelObj.isCustomLogo || channelObj.is3DLogo)) {
        logoContainer.innerHTML = generate3DLogo(channelObj.logoText, channelObj.subText, channelObj.color);
    } else {
        logoContainer.innerHTML = `<img src="${(channelObj && channelObj.logo) ? channelObj.logo : 'https://via.placeholder.com/40/000000/ffffff?text=TV'}" class="w-full h-full object-contain">`;
    }

    playerSection.classList.remove("hidden");
    loader.classList.remove("hidden");

    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

    if (Hls.isSupported()) {
        hlsInstance = new Hls({
            maxBufferLength: 25,        
            maxMaxBufferLength: 45,     
            stableBufferDelay: 3,       
            lowLatencyMode: true,       
            enableWorker: true,         
            abrEwmaFastLive: 1.0,       
            abrEwmaSlowLive: 5.0,       
            progressive: true
        });
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(()=>{
                // ব্রাউজার অটোপ্লে ব্লক করলে ভিডিও পজড থাকবে, যাতে ইউজার নিজে 'Play' বাটনে ক্লিক করে আনমিউটেড অবস্থায় দেখতে পারেন
                video.pause();
                updateOverlayIcons();
            });
            loader.classList.add("hidden");
            updateOverlayIcons();
            triggerPlayerControls();
        });
        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hlsInstance.startLoad();
                else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hlsInstance.recoverMediaError();
                else closePlayer();
            }
        });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        // addEventListener এর পরিবর্তে onloadedmetadata ব্যবহার করা হয়েছে মেমরি লিক এড়াতে
        video.onloadedmetadata = () => { 
            video.play().catch(()=>{
                video.pause();
                updateOverlayIcons();
            }); 
            loader.classList.add("hidden"); 
            updateOverlayIcons(); 
            triggerPlayerControls(); 
        };
    }
}

function triggerPlayerControls() {
    const overlay = document.getElementById("playerCustomControls");
    overlay.classList.remove("opacity-0","pointer-events-none");
    overlay.classList.add("opacity-100","pointer-events-auto");
    clearTimeout(controlsTimeout);
    controlsTimeout = setTimeout(() => {
        overlay.classList.remove("opacity-100","pointer-events-auto");
        overlay.classList.add("opacity-0","pointer-events-none");
    }, 3000);
}

function togglePlayPause() {
    const v = document.getElementById("videoPlayer");
    if (v.paused) v.play(); else v.pause();
    updateOverlayIcons(); triggerPlayerControls();
}

function updateOverlayIcons() {
    const v = document.getElementById("videoPlayer");
    const p = document.getElementById("playIcon"), pa = document.getElementById("pauseIcon");
    if (v.paused) { p.classList.remove("hidden"); pa.classList.add("hidden"); }
    else { p.classList.add("hidden"); pa.classList.remove("hidden"); }
}

    list.innerHTML = filtered.map((c,i)=>`
        <button data-i="${i}" class="search-row w-full flex items-center gap-3 p-2.5 card rounded-xl btn-press text-left">
            <div class="w-10 h-10 rounded-lg bg-black/40 border border-white/[0.05] flex items-center justify-center overflow-hidden p-1 shrink-0">
                ${c.isCustomLogo||c.is3DLogo?generate3DLogo(c.logoText,c.subText,c.color):`<img src="${c.logo||''}" class="w-full h-full object-contain" onerror="this.src='https://via.placeholder.com/60/000000/ffffff?text=TV'">`}
            </div>
            <div class="min-w-0 flex-1">
                <div class="text-[12px] font-bold text-gray-100 truncate">${c.name}</div>
                <div class="text-[10px] text-gray-500">${c.cat}</div>
            </div>
            <span class="text-emerald-400">▶</span>
        </button>`).join("") || `<div class="text-center text-gray-500 text-sm py-8">No channels found</div>`;
    list.querySelectorAll('.search-row').forEach(btn=>{
        btn.onclick = ()=>{ const c = filtered[parseInt(btn.dataset.i)]; toggleSearch(); executeCoreStream(c.url, c.name, c, 1); };
    });
}
</script>
</body>
</html>
