        const video = document.getElementById('video-player');
        const loadingOverlay = document.getElementById('loading-overlay');
        const currentChannelTitle = document.getElementById('current-channel-title');
        const muteBtn = document.getElementById('mute-btn');
        const muteIcon = document.getElementById('mute-icon');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const channelsGrid = document.getElementById('channels-grid');
        
        let hls = null;

        function initApp() {
            channelPlaylist.forEach((channel, index) => {
                const gridItem = document.createElement('div');
                gridItem.className = 'card-bg p-2.5 rounded-lg flex items-center space-x-2.5 cursor-pointer hover:border-blue-500/50 transition-all active:scale-95';
                gridItem.onclick = () => {
                    // Clicking manually forces sound on
                    video.muted = false;
                    updateMuteIcon();
                    playChannel(channel.url, channel.name);
                };
                
                gridItem.innerHTML = `
                    <img src="${channel.logo}" class="w-7 h-7 rounded object-contain bg-black/30 flex-shrink-0" onerror="this.src='https://i.ibb.co.com/vnbkF0r/fifa-world-cup-2026-logo-png-seeklogo-665644.png'">
                    <div class="overflow-hidden">
                        <p class="text-xs font-semibold text-gray-200 truncate">${channel.name}</p>
                        <span class="text-[10px] text-gray-500 flex items-center"><span class="w-1 h-1 bg-green-500 rounded-full mr-1"></span> Online</span>
                    </div>
                `;
                channelsGrid.appendChild(gridItem);
            });

            if(channelPlaylist.length > 0) {
                // Instantly trigger T Sports HD on absolute top with default unmuted sound
                playChannel(channelPlaylist[0].url, channelPlaylist[0].name);
            }
        }

        // Optimized Instant Player Core
        function playChannel(url, name) {
            loadingOverlay.style.opacity = '0';
            loadingOverlay.classList.add('hidden');

            currentChannelTitle.textContent = name;

            // Direct Video Flush to kill lag instantly
            video.pause();
            video.removeAttribute('src');
            video.load();

            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                
                // Aggressive Ultra Low Latency Engine
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 0,
                    maxBufferLength: 4,          
                    maxMaxBufferLength: 8,
                    liveSyncDurationCount: 1,    
                    maxStarvationDelay: 1,
                    progressive: true,
                    initialLiveManifestSize: 1
                });
                
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    // Core strict rule: always force false to un-mute
                    video.muted = false;
                    updateMuteIcon();
                    
                    video.play().catch(err => {
                        console.log("Autoplay Engine Handling:", err);
                        // Strict Browser Autoplay Policy Bypass: 
                        // If browser blocks unmuted playback initially, stream muted to avoid zero-load freeze
                        video.muted = true;
                        updateMuteIcon();
                        video.play();
                        
                        // BUT, the exact millisecond user touches anywhere on screen, burst the sound ON automatically!
                        const directSoundTrigger = () => {
                            video.muted = false;
                            updateMuteIcon();
                            document.removeEventListener('click', directSoundTrigger);
                            document.removeEventListener('touchstart', directSoundTrigger);
                        };
                        document.addEventListener('click', directSoundTrigger);
                        document.addEventListener('touchstart', directSoundTrigger);
                    });
                });
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR: hls.startLoad(); break;
                            case Hls.ErrorTypes.MEDIA_ERROR: hls.recoverMediaError(); break;
                            default: initFallbackPlayer(url); break;
                        }
                    }
                });
            } else {
                initFallbackPlayer(url);
            }
        }

        function initFallbackPlayer(url) {
            video.src = url;
            video.muted = false;
            updateMuteIcon();
            video.play().catch(err => console.log("Fallback Context:", err));
        }

        // Toggle Icon State Sync Engine
        function updateMuteIcon() {
            if (video.muted) {
                muteIcon.className = "fas fa-volume-xmark text-red-500";
            } else {
                muteIcon.className = "fas fa-volume-high text-green-400";
            }
        }

        // Clean Icon-Only Sound Controller
        muteBtn.addEventListener('click', () => {
            video.muted = !video.muted;
            updateMuteIcon();
        });

        // Fullscreen Toggle Controller
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (video.requestFullscreen) {
                    video.requestFullscreen();
                } else if (video.webkitEnterFullscreen) { 
                    video.webkitEnterFullscreen();
                } else if (video.webkitRequestFullscreen) {
                    video.webkitRequestFullscreen();
                } else if (video.msRequestFullscreen) {
                    video.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        });

        window.onload = initApp;
    </script>
</body>
</html>
