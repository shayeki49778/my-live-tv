<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FalconCast Premium IPTV</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            background-color: #0b121f;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .custom-scroll::-webkit-scrollbar {
            display: none;
        }
        .custom-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .card-bg {
            background-color: #121e31;
            border: 1px solid #1e2d42;
        }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col relative pb-20">

    <!-- লোড পেজ / স্প্ল্যাশ স্ক্রিন (ইউজার ইন্টারঅ্যাকশনের জন্য) -->
    <div id="welcome-load-page" class="fixed inset-0 bg-[#0b121f] z-[9999] flex flex-col items-center justify-center px-6 text-center transition-all duration-500">
        <div class="mb-6 animate-bounce">
            <i class="fas fa-tower-broadcast text-5xl text-blue-500"></i>
        </div>
        <h1 class="text-2xl font-bold text-white mb-2 tracking-wide">FalconCast IPTV</h1>
        <p class="text-sm text-gray-400 mb-8 max-w-[280px]">Enjoy premium sports and live streaming instantly.</p>
        
        <button id="enter-app-btn" class="w-full max-w-[200px] bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-full shadow-lg shadow-blue-600/30 active:scale-95 transition-all flex items-center justify-center space-x-2 cursor-pointer">
            <i class="fas fa-play text-xs"></i>
            <span>Watch Live</span>
        </button>
    </div>

    <div class="sticky top-0 z-50 w-full bg-[#0b121f]">
        <div class="relative aspect-video w-full bg-black shadow-lg">
            <video id="video-player" class="w-full h-full object-contain" playsinline autoplay></video>
            <div id="loading-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/80 transition-opacity duration-300 hidden opacity-0 z-10">
                <div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-500 border-t-transparent mb-2"></div>
                <span class="text-xs text-gray-300 font-medium tracking-wide">Buffering Stream...</span>
            </div>
        </div>

        <div class="flex items-center justify-between px-4 py-2 bg-[#121e31] border-b border-[#1e2d42]">
            <div class="flex items-center space-x-3">
                <button id="mute-btn" class="text-gray-300 hover:text-white text-base p-1.5 focus:outline-none transition-colors" title="Toggle Sound">
                    <i id="mute-icon" class="fas fa-volume-high text-green-400"></i>
                </button>
                <button id="fullscreen-btn" class="text-gray-300 hover:text-white text-base p-1.5 focus:outline-none transition-colors" title="Fullscreen">
                    <i class="fas fa-expand"></i>
                </button>
            </div>
            <div class="text-right">
                <span id="current-channel-title" class="text-xs font-medium text-blue-400 block truncate max-w-[180px]">Loading...</span>
            </div>
        </div>
    </div>

    <div class="px-4 mt-4 flex-grow">
        <h2 class="text-sm font-bold text-gray-400 mb-3 tracking-wider uppercase flex items-center justify-between">
            <span>Available Channels</span>
            <span class="text-[11px] text-blue-500 lowercase font-normal">Click to play</span>
        </h2>
        <div id="channels-grid" class="grid grid-cols-2 gap-2">
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#0b121f]/95 backdrop-blur-md border-t border-[#1e2d42] flex justify-around items-center py-2.5 z-50">
        <div class="flex flex-col items-center text-gray-500 cursor-pointer hover:text-gray-300">
            <i class="fas fa-gear text-lg"></i>
        </div>
        <div class="flex flex-col items-center text-gray-500 cursor-pointer hover:text-gray-300">
            <i class="fas fa-folder-open text-lg"></i>
        </div>
        <div class="flex flex-col items-center text-blue-500 cursor-pointer">
            <i class="fas fa-tower-broadcast text-lg"></i>
            <span class="text-[9px] font-bold mt-0.5">Live Events</span>
        </div>
        <div class="flex flex-col items-center text-gray-500 cursor-pointer hover:text-gray-300">
            <i class="fas fa-circle-nodes text-lg"></i>
        </div>
        <div class="flex flex-col items-center text-gray-500 cursor-pointer hover:text-gray-300">
            <i class="fas fa-circle-play text-lg"></i>
        </div>
    </div>

        const channelPlaylist = [

            { name: "FIFA Plus 🇩🇪 Germany", url: "https://4397879b.wurl.com/master/f36d25e7e52f1ba8d7e56eb859c636563214f541/UmFrdXRlblRWLWRlX0ZJRkFQbHVzR2VybWFuX0hMUw/playlist.m3u8", logo: "https://i.ibb.co.com/vnbkF0r/fifa-world-cup-2026-logo-png-seeklogo-665644.png" },
            { name: "FIFA Plus 🇮🇪 Itali", url: "https://5d95f7d7.wurl.com/master/f36d25e7e52f1ba8d7e56eb859c636563214f541/UmFrdXRlblRWLWl0X0ZJRkFQbHVzSXRhbGlhbl9ITFM/playlist.m3u8", logo: "https://i.ibb.co.com/vnbkF0r/fifa-world-cup-2026-logo-png-seeklogo-665644.png" },
            { name: "FIFA Plus 🇧🇷 Brazil", url: "https://e3be9ac5.wurl.com/master/f36d25e7e52f1ba8d7e56eb859c636563214f541/TEctYnJfRklGQVBsdXNQb3J0dWd1ZXNlX0hMUw/playlist.m3u8", logo: "https://i.ibb.co.com/vnbkF0r/fifa-world-cup-2026-logo-png-seeklogo-665644.png" },
            { name: "FIFA Plus 🇪🇸 Spain", url: "https://d63fabad.wurl.com/master/f36d25e7e52f1ba8d7e56eb859c636563214f541/UmFrdXRlblRWLWVzX0ZJRkFQbHVzU3BhbmlzaF9ITFM/playlist.m3u8", logo: "https://i.ibb.co.com/vnbkF0r/fifa-world-cup-2026-logo-png-seeklogo-665644.png" },
            { name: "FIFA Plus 🇺🇸 USA", url: "https://d2w9q46ikgrcwx.cloudfront.net/v1/master/3722c60a815c199d9c0ef36c5b73da68a62b09d1/cc-of5cbk3sav3w5/v1/sysdata_s_p_a_fifa_7/samsungheadend_us/latest/main/hls/playlist.m3u8", logo: "https://i.ibb.co.com/vnbkF0r/fifa-world-cup-2026-logo-png-seeklogo-665644.png" },
            { name: "Fox Sports 2 - (FIFA)", url: "https://tvsen7.aynaott.com/foxsports2/index.m3u8?e=1779283790&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=cbb7f40b4af7be51a91e0629a5ac7238", logo: "https://imglink.cc/cdn/o5BoWU_BEz.png" },
            { name: "T Sports HD 🇧🇩 Bangladesh", url: "http://27.124.71.27/T-Sports/index.m3u8", logo: "https://i.ibb.co.com/vnbkF0r/fifa-world-cup-2026-logo-png-seeklogo-665644.png" },
            { name: "T Sports B 🇧🇩 Bangladesh", url: "https://tvsen7.aynaott.com/tsports-hd/index.m3u8?e=1779283784&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=3b4c5a2cfa872fa7f91ffbfb4aa0f658", logo: "https://i.ibb.co.com/vnbkF0r/fifa-world-cup-2026-logo-png-seeklogo-665644.png" },
            { name: "BTV 🇧🇩 Bangladesh", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1709/output/index.m3u8", logo: "https://i.ibb.co.com/vnbkF0r/fifa-world-cup-2026-logo-png-seeklogo-665644.png" },
            { name: "Somoy TV 🇧🇩 Bangladesh", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1702/output/index.m3u8", logo: "https://i.ibb.co.com/vnbkF0r/fifa-world-cup-2026-logo-png-seeklogo-665644.png" },
            { name: "Tyc Sports 🇦🇷 Argentina", url: "https://amg26268-amg26268c14-freelivesports-emea-10267.playouts.now.amagi.tv/ts-us-e2-n2/playlist/amg26268-sportsstudio-tycsports-freelivesportsemea/playlist.m3u8", logo: "https://imglink.cc/cdn/1oSRQnyUqK.jpg" },
            { name: "Tyc Sports B 🇦🇷", url: "http://cdn.tv-rds.workers.dev/TYCSPT.m3u8", logo: "https://imglink.cc/cdn/1oSRQnyUqK.jpg" },
            { name: "DSports 🇦🇷", url: "http://cablemaxsigloxxi.com:8000/play/a0l4/index.m3u8", logo: "https://imglink.cc/cdn/eYP_0o2cnt.jpg" },
            { name: "Caze TV 🇧🇷 Brazil", url: "https://dfr80qz435crc.cloudfront.net/MNOP/Amagi/Caze/Caze_TV_BR/1080p-vtt/index.m3u8", logo: "https://i.ibb.co.com/vnbkF0r/fifa-world-cup-2026-logo-png-seeklogo-665644.png" },
            { name: "Caze TV B 🇧🇷", url: "https://dfr80qz435crc.cloudfront.net/MNOP/Amagi/Caze/Caze_TV_BR/Caze_TV.m3u8", logo: "https://i.ibb.co.com/vnbkF0r/fifa-world-cup-2026-logo-png-seeklogo-665644.png" },
            { name: "DAZN 1 HD", url: "http://znty.dyndns.org:5010/hls/eleven1.m3u8", logo: "https://imglink.cc/cdn/Kvj2fsr4S8.png" },
            { name: "Bein Sports 1", url: "http://27.124.71.27/beIN_Sports_1/index.m3u8", logo: "https://imglink.cc/cdn/kIiut6WBq0.jpg" },
            { name: "Cricbuzz HD", url: "http://4kgood.org:80/live/4o48up5evz/r4fiast66u/1163988.ts", logo: "https://imglink.cc/cdn/GGm9H9tLHP.png" },
            { name: "Willow HD TV", url: "https://tvsen5.aynaott.com/willowhd/index.m3u8?e=1779283803&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=2fe7bf4f892cf09f80087b8146545bad", logo: "https://imglink.cc/cdn/GGm9H9tLHP.png" },
            { name: "Star Sports 1", url: "https://tvsen7.aynaott.com/sspts1/index.m3u8", logo: "https://imglink.cc/cdn/va7WOdXDQC.jpg" }
        ];

        const video = document.getElementById('video-player');
        const loadingOverlay = document.getElementById('loading-overlay');
        const currentChannelTitle = document.getElementById('current-channel-title');
        const muteBtn = document.getElementById('mute-btn');
        const muteIcon = document.getElementById('mute-icon');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const channelsGrid = document.getElementById('channels-grid');
        
        // লোড পেজ এলিমেন্টস
        const welcomePage = document.getElementById('welcome-load-page');
        const enterBtn = document.getElementById('enter-app-btn');
        
        let hls = null;
        let isAppActive = false;

        function showLoader() {
            loadingOverlay.classList.remove('hidden');
            loadingOverlay.style.opacity = '1';
        }

        function hideLoader() {
            loadingOverlay.style.opacity = '0';
            setTimeout(() => {
                loadingOverlay.classList.add('hidden');
            }, 200);
        }

        function initApp() {
            channelPlaylist.forEach((channel, index) => {
                const gridItem = document.createElement('div');
                gridItem.className = 'card-bg p-2.5 rounded-lg flex items-center space-x-2.5 cursor-pointer hover:border-blue-500/50 transition-all active:scale-95';
                gridItem.onclick = () => {
                    video.muted = false;
                    updateMuteIcon();
                    playChannel(channel.url, channel.name);
                };
                
                gridItem.innerHTML = `
                    <img src="${channel.logo}" class="w-7 h-7 rounded object-contain bg-black/30 flex-shrink-0" onerror="this.src='https://i.ibb.co.com/vnbkF0r/fifa-world-cup-2026-logo-png-seeklogo-665644.png'">
                    <div class="overflow-hidden">
                        <p class="text-xs font-semibold text-gray-200 truncate">${channel.name}</p>
                        <span class="text-[10px] text-gray-500 flex items-center"><span class="w-1 h-1 bg-green-500 rounded-full mr-1"></span> Online</span>
                    </div>
                `;
                channelsGrid.appendChild(gridItem);
            });

            // ইউজার "Watch Live" বাটনে ক্লিক করলে অ্যাপ ওপেন হবে এবং সাউন্ড আনমিউট হবে
            enterBtn.addEventListener('click', () => {
                isAppActive = true;
                
                // লোড পেজটি হাইড করা
                welcomePage.style.opacity = '0';
                setTimeout(() => {
                    welcomePage.style.display = 'none';
                }, 500);

                // প্লেয়ার আনমিউট এবং প্লে স্টার্ট
                video.muted = false;
                updateMuteIcon();
                
                if(channelPlaylist.length > 0) {
                    playChannel(channelPlaylist[0].url, channelPlaylist[0].name);
                }
            });
        }

        function playChannel(url, name) {
            if (!isAppActive) return; // অ্যাপ একটিভ না হলে ব্যাকগ্রাউন্ডে প্লে হবে না

            showLoader();
            currentChannelTitle.textContent = name;

            video.pause();
            video.removeAttribute('src');
            video.load();

            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 0,
                    maxBufferLength: 2,          
                    maxMaxBufferLength: 4,
                    liveSyncDurationCount: 1,    
                    maxStarvationDelay: 1,
                    progressive: true,
                    initialLiveManifestSize: 1
                });
                
                hls.loadSource(url);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.muted = false;
                    updateMuteIcon();
                    
                    video.play().then(() => {
                        hideLoader();
                    }).catch(err => {
                        console.log("Autoplay context handled");
                        hideLoader();
                    });
                });

                video.onwaiting = () => { showLoader(); };
                video.onplaying = () => { hideLoader(); };

                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR: hls.startLoad(); break;
                            case Hls.ErrorTypes.MEDIA_ERROR: hls.recoverMediaError(); break;
                            default: initFallbackPlayer(url); break;
                        }
                    }
                });
            } else {
                initFallbackPlayer(url);
            }
        }

        function initFallbackPlayer(url) {
            video.src = url;
            video.muted = false;
            updateMuteIcon();
            
            video.onwaiting = () => { showLoader(); };
            video.onplaying = () => { hideLoader(); };
            
            video.play().then(() => {
                hideLoader();
            }).catch(err => {
                hideLoader();
            });
        }

        function updateMuteIcon() {
            if (video.muted) {
                muteIcon.className = "fas fa-volume-xmark text-red-500";
            } else {
                muteIcon.className = "fas fa-volume-high text-green-400";
            }
        }

        muteBtn.addEventListener('click', () => {
            video.muted = !video.muted;
            updateMuteIcon();
        });

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (video.requestFullscreen) {
                    video.requestFullscreen();
                } else if (video.webkitEnterFullscreen) { 
                    video.webkitEnterFullscreen();
                } else if (video.webkitRequestFullscreen) {
                    video.webkitRequestFullscreen();
                } else if (video.msRequestFullscreen) {
                    video.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        });

        window.onload = initApp;
    </script>
</body>
</html>
